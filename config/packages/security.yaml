security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                success_handler: App\Security\LoginSuccessHandler

            logout:
                path: app_logout
                target: app_login

    access_control:
        # STAFF DASHBOARD - STAFF ONLY
        - { path: ^/staff/dashboard, roles: ROLE_STAFF }

        # ADMIN ONLY
        - { path: ^/dashboard, roles: ROLE_ADMIN }
        - { path: ^/admin/users, roles: ROLE_ADMIN }
        - { path: ^/customers, roles: ROLE_ADMIN }
        - { path: ^/payments, roles: ROLE_ADMIN }

        # ADMIN AND STAFF - ORDERS VIEW ACCESS
        - { path: ^/orders, roles: [ROLE_ADMIN, ROLE_STAFF] }

        # ADMIN AND STAFF - PRODUCTS, INVENTORY, CATEGORIES
        - { path: ^/product, roles: [ROLE_ADMIN, ROLE_STAFF] }
        - { path: ^/category, roles: [ROLE_ADMIN, ROLE_STAFF] }

        # ALL AUTHENTICATED USERS
        - { path: ^/account, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
