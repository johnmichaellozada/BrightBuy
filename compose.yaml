services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brightbuy-php
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      database:
        condition: service_healthy
    networks:
      - platform-network

  database:
    image: mysql:8.0
    container_name: brightbuy-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: brightbuy_symfony
    ports:
      - "3310:3306"
    volumes:
      - symfony-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      platform-network:
        aliases:
          - symfony-db

  phpmyadmin:
    image: phpmyadmin
    container_name: brightbuy-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - platform-network

volumes:
  symfony-db-data:
    external: true

networks:
  platform-network:
    external: true
